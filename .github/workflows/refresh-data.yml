name: Refresh data

# 数据动态更新：定时刷工具元数据、论文元数据与新闻候选，验证能构建后直接提交并
# 推送到 main，交给 deploy.yml 自动部署。全流程无人值守。
#
# 自动化的边界（只碰机器可验证的字段）：
#   - fetch:github 只回填 stars / archived / lastPush；license 冲突只打印、不自动改写。
#   - fetch:news 的候选只落在 content-inbox/，不在 src/content/ 下，因此不会被站点
#     渲染；要收录仍需人工补齐 keyFact / whyItMatters 后手动移进 src/content/events/。

on:
  schedule:
    # 每天 02:17 UTC（北京时间 10:17）。避开整点，减少排队。
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh tool metadata
        env:
          # 未认证时 GitHub API 上限 60 次/小时，认证后 5,000 次/小时。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run fetch:github 2>&1 | tee /tmp/github-refresh.log

      - name: Collect news candidates
        run: |
          set -o pipefail
          npm run fetch:news 2>&1 | tee /tmp/news-refresh.log

      # 论文标题与作者只会在 arXiv 修订时变化，但 updatedDate 需要跟着走，
      # 否则 sitemap 里的 lastmod 会停在旧值。
      - name: Refresh paper metadata
        run: |
          set -o pipefail
          npm run fetch:papers 2>&1 | tee /tmp/papers-refresh.log

      # 刷新后的数据若违反 schema（例如 category 拼错），这里会先失败，
      # 不至于把坏数据直接推上 main 部署出去。
      - name: Verify the site still builds
        run: npm run build

      - name: Write run summary
        run: |
          {
            echo "## 数据动态刷新"
            echo
            echo "运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')　工作流：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "### 工具元数据（机器可验证）"
            echo
            echo '```'
            tail -n 40 /tmp/github-refresh.log
            echo '```'
            echo
            echo "> \`stars\` / \`archived\` / \`lastPush\` 由 GitHub API 回填，只覆盖这三个字段，"
            echo "> 手写的 license、description、keyFact 不会被改动。上面若出现 license 冲突，"
            echo "> 说明手写值与 GitHub 的判定不一致，需要人工决定是否更新。"
            echo
            echo "### 论文元数据（机器可验证）"
            echo
            echo '```'
            tail -n 30 /tmp/papers-refresh.log
            echo '```'
            echo
            echo "> 标题、作者、首次提交与最新修订取自 arXiv API。若上面出现「标题不一致」，"
            echo "> 多半是 arXiv 上论文改过标题，需要人工确认。"
            echo
            echo "### 新闻候选（**不会**自动发布）"
            echo
            echo '```'
            tail -n 25 /tmp/news-refresh.log
            echo '```'
            echo
            echo "候选写入 \`content-inbox/news-candidates.json\`，不在 \`src/content/\` 下，"
            echo "所以不会被站点渲染。要收录的话："
            echo
            echo "1. 在候选里挑出值得收录的；"
            echo "2. 补齐 \`keyFact\`、\`whyItMatters\`、\`sourceUrl\` 等字段；"
            echo "3. 移到 \`src/content/events/\` 并显式设置 \`verification\`；"
            echo "4. 把该条从 \`content-inbox/news-candidates.json\` 中删掉。"
            echo
            echo "不打算收录的候选可以留在原处——脚本会按 URL 去重，不会重复刷出来。"
            echo
            echo "> 本轮刷新结果将自动提交并推送到 \`main\`，由 deploy.yml 自动部署。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push to main
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/content/tools src/content/papers content-inbox)" ]; then
            echo "本轮没有任何变更，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/content/tools src/content/papers content-inbox
          git commit -m "chore: refresh tool, paper and news metadata"
          git push origin HEAD:main
