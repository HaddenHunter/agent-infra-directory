name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # OG 图在构建期由 sharp(librsvg) 栅格化 SVG 生成，文字要依赖系统字体。
      # runner 镜像不保证带 CJK 字体，缺了会让中文 OG 图变成空白卡片，
      # 所以这里显式装上：dejavu 覆盖拉丁，noto-cjk 覆盖中文。
      - name: Install fonts for OG image rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-cjk

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 部署完成之后再推，保证 IndexNow 去取 key 文件时它已经在线。
      # 脚本零依赖（只用 node 自带的 fetch），用 runner 预装的 node 即可。
      - uses: actions/checkout@v4

      - name: Notify IndexNow (Bing / Yandex)
        run: node scripts/ping-indexnow.mjs
